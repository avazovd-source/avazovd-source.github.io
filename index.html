<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Інвентаризація голосом</title></head>
<body><p id="l" style="font:16px system-ui;padding:20px">Завантаження…</p>
<script>
(async function(){
var BASE='https://raw.githubusercontent.com/avazovd-source/avazovd-source.github.io/26cb0ec6392b704ca34974fc8f534945bf7855bd/index.html';
var V='4';
var R=[
['const part=queue.shift();const p=parsePhrase(part);if(!p.nameWs.length)continue;',
 'const part=queue.shift();if(await window.__inv.pre(part,{parsePhrase,norm,ARTS,commit,esc,$}))continue;const p=parsePhrase(part);if(!p.nameWs.length){await window.__inv.bare(p,{commit});continue}'],
['const p=parsePhrase(part);if(p.qty==null||!p.nameWs.length)return;processed=v;handle(part)}',
 'if(!window.__inv.ready(part,{parsePhrase,norm,ARTS}))return;processed=v;handle(part)}'],
['Скажіть: назва або артикул, кількість, одиниця. Кілька позицій — через «далі».',
 'Скажіть артикул (5 знаків) і одразу кількість: «5 3 1 8 2, 8,370 кілограмів». Або назву й кількість.'],
['</head>','<script src="patch.js?v='+V+'"><\/script></head>']
];
try{
 var r=await fetch(BASE,{cache:'no-cache'});if(!r.ok)throw new Error('HTTP '+r.status);
 var h=await r.text(),miss=0;
 R.forEach(function(x){if(h.indexOf(x[0])<0)miss++;else h=h.split(x[0]).join(x[1])});
 h=h.split('Версія 3 · веб').join('Версія '+V+' · веб'+(miss?' (патч неповний: '+miss+')':''));
 document.open();document.write(h);document.close();
}catch(e){document.getElementById('l').textContent='Не вдалося завантажити сторінку: '+(e&&e.message||e)+'. Оновіть сторінку.'}
})();
</script></body></html>

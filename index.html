<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Інвентаризація голосом</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: тихий робочий інструмент для холодильної камери — коротко, великі цілі для пальців у рукавичках
   IDEA: інвентаризаційний бланк, що заповнюється сам: кажеш — рядок з'являється
   PICTURE: велика кругла кнопка мікрофона й картка розпізнаного рядка
   COLOUR and TYPE: білий, чорнильно-синій, небесна смуга, помаранчевий для дії; Outfit + Inter
   LAYOUT: одна колонка до 760px: смуга з мікрофоном, далі вкладки Внесено / Усі артикули / Не пораховано */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0b1726);--ink:light-dark(#10223a,#e8eef6);--mut:light-dark(#5b6b80,#9fb0c4);--line:light-dark(#e3e8ef,#1f3147);--card:light-dark(#f5f8fb,#12233a);--sky:light-dark(#4fb3e8,#1e5f86);--acc:#ff7a1a;--ok:light-dark(#0f7b4b,#5fd39b);--bad:light-dark(#c0392b,#ff8a7a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,.big{font-family:Outfit,Inter,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:0 max(4vw,14px)}
header{background:var(--sky);color:#fff;padding:18px 0 22px}
header h1{margin:0;font-size:30px;line-height:1.05;font-weight:600}
.sub{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;font-size:14px}
select,input,button{font:inherit;font-size:16px}
select,input{min-height:44px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);color:var(--ink)}
header select{background:#fff;color:#10223a;border:0}
button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.hbtn{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.5);color:#fff}
.voice{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;padding:20px 0 8px}
#mic{width:96px;height:96px;border-radius:50%;border:0;background:var(--acc);color:#fff;display:grid;place-items:center;box-shadow:0 8px 22px rgba(255,122,26,.35)}
#mic svg{width:42px;height:42px}
#mic.on{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,122,26,.55)}100%{box-shadow:0 0 0 22px rgba(255,122,26,0)}}
@media(prefers-reduced-motion:reduce){#mic.on{animation:none;outline:4px solid var(--acc)}}
.say{display:flex;gap:8px}.say input{flex:1}
.hint{color:var(--mut);font-size:14px;margin:6px 0 0}
#partial{min-height:24px;color:var(--mut);font-style:italic;margin-top:6px}
.res{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;margin:10px 0}
.res .big{font-size:22px;font-weight:600}
.cands{display:grid;gap:6px;margin-top:8px}
.cands button{text-align:left;display:flex;justify-content:space-between;gap:10px}
.tag{font-size:13px;color:var(--mut);white-space:nowrap}
.zones{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.zones button{min-height:36px;padding:4px 12px;font-size:14px}
.zones button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:14px;overflow-x:auto}
nav button{border:0;background:none;border-bottom:3px solid transparent;border-radius:0;white-space:nowrap}
nav button[aria-selected=true]{border-bottom-color:var(--acc);font-weight:600}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.tools input{flex:1 1 220px}
ul.list{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.nm{font-weight:500}.art{color:var(--mut);font-size:13px}
.qty{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;text-align:right}
.qin{display:flex;gap:6px;align-items:center}.qin input{width:92px;text-align:right}
.ent{grid-column:1/-1;display:none;font-size:14px;color:var(--mut)}
.row.open .ent{display:block}
.ent div{display:flex;justify-content:space-between;gap:8px;padding:4px 0}
.del{min-height:32px;padding:2px 10px;font-size:13px}
.warn{color:var(--bad);font-size:13px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;display:none;gap:12px;align-items:center;max-width:94vw;z-index:9}
#toast button{min-height:34px;background:none;color:var(--acc);border:0;font-weight:600}
.banner{background:light-dark(#fff4e8,#3a2510);border:1px solid var(--acc);border-radius:10px;padding:8px 12px;font-size:14px;margin-top:10px;display:none}
.foot{display:flex;gap:8px;flex-wrap:wrap;padding:18px 0 80px}
.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);max-width:420px;width:92vw}
textarea{width:100%;min-height:160px;font:13px/1.4 ui-monospace,monospace}
@media(max-width:600px){header h1{font-size:26px}#mic{width:80px;height:80px}.voice{gap:12px}}
</style></head><body>

<div class="banner" id="banner"></div>
<section class="voice">

<div>

<div id="partial"></div>
</div></section>
<div class="zones" id="zones" aria-label="Місце"></div>
<div id="result"></div>
<nav role="tablist"><button role="tab" data-t="done" aria-selected="true">Внесено <span id="cDone"></span></button><button role="tab" data-t="all">Усі артикули</button><button role="tab" data-t="left">Не пораховано <span id="cLeft"></span></button></nav>
<div class="tools"><input id="q" type="search" placeholder="Пошук: назва або артикул" aria-label="Пошук"><select id="kind" aria-label="Тип"><option value="">Сировина і н/ф</option><option value="all">Усе, з готовою продукцією</option></select></div>
<ul class="list" id="list"></ul>
<div class="foot"><span class="hint" style="flex-basis:100%">Версія 3 · веб</span><button class="primary" id="exp" type="button">Надіслати / зберегти файл (CSV)</button><button id="copy" type="button">Копіювати таблицею</button><span class="hint" id="stat"></span></div>
</main>
<div id="toast" role="status"><span id="tmsg"></span><button id="undo" type="button">Скасувати</button></div>
<dialog id="dlg"><p>Скопіюйте вручну:</p><textarea id="dtext" readonly></textarea><button id="dclose" type="button">Закрити</button></dialog>

 return{qty,unit,nameWs,text}}
function findArt(nameWs){if(!nameWs.length)return[];const pool=$('kind').value==='all'?ARTS:ARTS.filter(a=>a.kind!=='гп');const sc=(pool.length?pool:ARTS).map(a=>({a,s:score(a,nameWs)})).filter(x=>x.s>.3).sort((x,y)=>y.s-x.s);return sc.slice(0,6)}
function convert(a,qty,said){if(!said||said===a.unit||(said==='пак'&&a.unit==='шт'))return{q:qty,bad:false};if(said==='г'&&a.unit==='кг')return{q:qty/1000,bad:false};if(said==='кг'&&a.unit==='г')return{q:qty*1000,bad:false};return{q:qty,bad:true}}
// ---------- storage ----------
let db=null,me='',sid=null,unsub=null,entries=[],local=false,zone='';
const ZONES=['Холодильник','Морозильна камера','Склад сухий','Цех'];
$('zones').innerHTML=['Без місця',...ZONES].map((z,i)=>`<button type="button" aria-pressed="${i===0}" data-z="${i?esc(z):''}">${esc(z)}</button>`).join('');
$('zones').onclick=e=>{const b=e.target.closest('button');if(!b)return;zone=b.dataset.z;for(const x of $('zones').children)x.setAttribute('aria-pressed',x===b)};
const today=()=>new Date().toISOString().slice(0,10);
function lsGet(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
async function addEntry(e){if(db){try{const ref=await db.collection(`inv/${sid}/entries`).add(e);return ref.id}catch(err){banner('Не вдалося зберегти: '+(err.code||'помилка')+'. Спробуйте ще раз.');return null}}
 e.id='l'+Date.now()+Math.random().toString(36).slice(2,6);entries.push(e);lsSet('inv:'+sid,entries);render();return e.id}
async function delEntry(id){if(db){try{await db.doc(`inv/${sid}/entries/${id}`).delete()}catch(err){banner('Не вдалося видалити.')}return}entries=entries.filter(x=>x.id!==id);lsSet('inv:'+sid,entries);render()}
function banner(t){const b=$('banner');b.textContent=t;b.style.display=t?'block':'none'}
function openSession(s){sid=s;if(unsub){unsub();unsub=null}entries=[];render();
 if(db){const t=setTimeout(()=>banner('Дані поки недоступні — перевірте зв’язок.'),10000);
  unsub=db.collection(`inv/${sid}/entries`).orderBy('t').onSnapshot(sn=>{if(!sn.metadata.fromCache){clearTimeout(t);banner('')}entries=sn.docs.map(d=>({id:d.id,...d.data()}));render()},err=>{clearTimeout(t);banner('Зв’язок з базою втрачено ('+err.code+'). Нові записи не збережуться.')})}
 else{entries=lsGet('inv:'+sid,[]);render()}}
function fillSessions(list){const sel=$('sess');const cur=sid;sel.innerHTML=list.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');if(cur&&list.includes(cur))sel.value=cur;else if(list.length){sel.value=list[list.length-1];openSession(sel.value)}}
$('sess').onchange=e=>openSession(e.target.value);
$('newS').onclick=async()=>{let s=today();const have=[...$('sess').options].map(o=>o.value);let n=2;while(have.includes(s))s=today()+'-'+(n++);
 lsSet('inv:sessions',[...have,s]);fillSessions([...have,s]);sid=null;$('sess').value=s;openSession(s)};
// ---------- input ----------
let lastAdded=[];
async function commit(a,p,cands){const c=convert(a,p.qty,p.unit);const e={art:a.art,name:a.name,unit:a.unit,qty:c.q,said:p.unit||a.unit,saidQty:p.qty,bad:c.bad,zone,by:me,t:Date.now(),raw:p.text.slice(0,200)};
 const id=await addEntry(e);if(!id)return;lastAdded=[id];try{const h=$('hstat');h.style.background='#0f7b4b';h.style.padding='2px 8px';h.style.borderRadius='8px';setTimeout(()=>{h.style.background='';h.style.padding=''},1200)}catch(e){}toast(`${a.name}: +${fmt(c.q)} ${c.bad?p.unit:a.unit}${c.bad?' (інша одиниця!)':''}`);
 $('result').innerHTML=`<div class="res"><div class="big">${esc(a.name)}</div><div>${esc(a.art)} · <b>+${esc(fmt(c.q))} ${esc(c.bad?p.unit:a.unit)}</b>${c.bad?` <span class="warn">у 1С одиниця «${esc(a.unit)}» — перевірте</span>`:''}</div>${cands&&cands.length>1?`<p class="hint">Не той артикул? Натисніть правильний — запис заміниться.</p><div class="cands">${cands.slice(1,4).map((x,i)=>`<button type="button" data-swap="${i+1}">${esc(x.a.name)}<span class="tag">${esc(x.a.art)} · ${esc(x.a.unit)}</span></button>`).join('')}</div>`:''}</div>`;
 const box=$('result').querySelector('.cands');if(box)box.onclick=async ev=>{const b=ev.target.closest('button');if(!b)return;await delEntry(id);commit(cands[+b.dataset.swap].a,p,null)}}
function ask(p,cands,msg){$('result').innerHTML=`<div class="res"><div>${esc(msg)}</div><div class="hint">«${esc(p.text)}»</div><div class="cands">${cands.map((x,i)=>`<button type="button" data-i="${i}">${esc(x.a.name)}<span class="tag">${esc(x.a.art)} · ${esc(x.a.unit)}</span></button>`).join('')}</div></div>`;
 $('result').querySelector('.cands').onclick=async ev=>{const b=ev.target.closest('button');if(!b)return;const a=cands[+b.dataset.i].a;if(p.qty==null){processed='';$('say').value=a.name+' ';$('say').focus();$('result').innerHTML='';process();return}await commit(a,p,null);process()}}
const queue=[];let busy=false;
function handle(text){for(const part of String(text).split(/\s*(?:;|\.(?!\d)|(?:^|\s)(?:далі|дальше|наступн[а-яіїєґ]*)(?=\s|$))\s*/i))if(part.trim())queue.push(part);process()}
async function process(){if(busy)return;busy=true;while(queue.length){const part=queue.shift();const p=parsePhrase(part);if(!p.nameWs.length)continue;const c=findArt(p.nameWs);
 if(!c.length){$('result').innerHTML=`<div class="res"><span class="warn">Не знайшов артикул:</span> «${esc(part)}». Скажіть інакше або знайдіть у списку «Усі артикули».</div>`;continue}
 if(p.qty==null){busy=false;ask(p,c,'Не почув кількість. Оберіть артикул і допишіть кількість:');return}
 const sure=c[0].s>=.75&&(c.length<2||c[0].s-c[1].s>=.12);if(sure){await commit(c[0].a,p,c)}else{busy=false;ask(p,c,`Кількість ${fmt(p.qty)} ${p.unit||''} — який артикул?`+(queue.length?` (далі в черзі: ${queue.length})`:''));return}}busy=false}
let kb=/iPhone|iPad|iPod/.test(navigator.userAgent),processed='',kt=null;
const KBHINT='Натисніть мікрофон на клавіатурі і говоріть: «назва, кількість, одиниця». Після паузи позиція додається сама — одразу кажіть наступну.';
function kbStart(){kb=true;processed='';const i=$('say');i.value='';i.focus();try{i.scrollIntoView({block:'center'})}catch(e){}$('hint').textContent=KBHINT;$('hint').style.cssText='color:var(--ink);font-weight:600'}
function kbFlush(){const v=$('say').value;const part=v.startsWith(processed)?v.slice(processed.length):v;if(!part.trim())return;const p=parsePhrase(part);if(p.qty==null||!p.nameWs.length)return;processed=v;handle(part)}
$('say').addEventListener('input',()=>{if(!kb)return;clearTimeout(kt);kt=setTimeout(kbFlush,1600)});
$('say').addEventListener('blur',()=>{if(kb&&processed&&$('say').value===processed){$('say').value='';processed=''}});
if(kb)$('hint').textContent='iPhone: натисніть поле або помаранчеву кнопку, потім мікрофон на клавіатурі. Позиції додаються самі після паузи.';
$('sayF').onsubmit=e=>{e.preventDefault();clearTimeout(kt);const v=$('say').value;const part=(kb&&processed&&v.startsWith(processed)?v.slice(processed.length):v).trim();if(part)handle(part);$('say').value='';processed=''};
// ---------- dictation ----------
let dict=null,listening=false;
$('mic').onclick=()=>{if(!dict){kbStart();return}
 if(listening){dict.stop().catch(()=>{});return}
 dict.start().catch(err=>{if(err&&err.code==='not_granted'){dict=null;$('hint').textContent='Доступ до мікрофона не надано — користуйтеся диктуванням клавіатури.'}})};
(()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;let rec=null,want=false;
 dict={start(){want=true;rec=new SR();rec.lang='uk-UA';rec.continuous=true;rec.interimResults=true;
  rec.onresult=ev=>{let part='';for(let i=ev.resultIndex;i<ev.results.length;i++){const r=ev.results[i];if(r.isFinal){$('partial').textContent='';handle(r[0].transcript)}else part+=r[0].transcript}if(part)$('partial').textContent=part};
  rec.onstart=()=>{listening=true;$('mic').classList.add('on')};rec.onend=()=>{if(want){try{rec.start();return}catch(e){}}listening=false;$('mic').classList.remove('on')};
  rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){want=false;dict=null;$('hint').textContent='Доступ до мікрофона не надано — користуйтеся диктуванням клавіатури.'}};
  rec.start();return Promise.resolve()},stop(){want=false;try{rec&&rec.stop()}catch(e){}return Promise.resolve()}}})();
// ---------- lists ----------
let tab='done';
document.querySelector('nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;for(const x of document.querySelectorAll('nav button'))x.setAttribute('aria-selected',x===b);render()};
$('q').oninput=render;$('kind').onchange=render;
function totals(){const m=new Map();for(const e of entries){const k=e.art;if(!m.has(k))m.set(k,{q:0,bad:[],list:[]});const t=m.get(k);if(e.bad)t.bad.push(e);else t.q+=e.qty;t.list.push(e)}return m}
function render(){const T=totals();const q=norm($('q').value);const pool=$('kind').value==='all'?ARTS:ARTS.filter(a=>a.kind!=='гп');
 const match=a=>!q||a.key.includes(q)||norm(a.name).includes(q);
 $('cDone').textContent=T.size?`(${T.size})`:'';const left=pool.filter(a=>!T.has(a.art));$('cLeft').textContent=`(${left.length})`;
 let html='';
 if(tab==='done'){const rows=ARTS.filter(a=>T.has(a.art)&&match(a));
  html=rows.length?rows.map(a=>{const t=T.get(a.art);return`<li class="row" data-a="${esc(a.art)}"><div><div class="nm">${esc(a.name)}</div><div class="art">${esc(a.art)} · записів ${t.list.length}${t.bad.length?` · <span class="warn">${t.bad.length} з іншою одиницею</span>`:''}</div></div><div class="qty">${esc(fmt(t.q))} ${esc(a.unit)}</div><div class="ent">${t.list.map(e=>`<div><span>${esc(fmt(e.bad?e.saidQty:e.qty))} ${esc(e.bad?e.said:a.unit)}${e.zone?' · '+esc(e.zone):''} · ${esc(new Date(e.t).toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'}))}</span><button class="del" type="button" data-del="${esc(e.id)}">Видалити</button></div>`).join('')}</div></li>`}).join(''):`<li class="hint" style="padding:16px 0">Ще нічого не внесено. Натисніть мікрофон і скажіть, наприклад: «картопля очищена двадцять три кілограми».</li>`}
 else{const rows=(tab==='left'?left:pool).filter(match).slice(0,q?200:500);
  html=rows.map(a=>{const t=T.get(a.art);return`<li class="row"><div><div class="nm">${esc(a.name)}</div><div class="art">${esc(a.art)}${t?` · внесено ${esc(fmt(t.q))} ${esc(a.unit)}`:''}</div></div><form class="qin" data-a="${esc(a.art)}"><input inputmode="decimal" aria-label="Кількість, ${esc(a.unit)}" placeholder="${esc(a.unit)}"><button type="submit" aria-label="Додати">+</button></form></li>`}).join('')}
 $('list').innerHTML=html;
 const all=ARTS.filter(a=>T.has(a.art)).length;$('hstat').textContent=`Внесено: ${entries.length} записів · ${all} артикулів`;$('stat').textContent=entries.length?`${entries.length} записів, ${all} артикулів${local?' · лише на цьому пристрої':''}`:''}
$('list').onclick=e=>{const d=e.target.closest('[data-del]');if(d){delEntry(d.dataset.del);return}const r=e.target.closest('.row[data-a]');if(r&&!e.target.closest('form'))r.classList.toggle('open')};
$('list').onsubmit=e=>{e.preventDefault();const f=e.target.closest('form');const v=parseFloat(f.querySelector('input').value.replace(',','.'));if(!(v>=0))return;const a=ARTS.find(x=>x.art===f.dataset.a);commit(a,{qty:v,unit:a.unit,text:'вручну'},null);f.querySelector('input').value=''};
// ---------- toast / export ----------
let tt=null;function toast(m){$('tmsg').textContent=m;$('toast').style.display='flex';clearTimeout(tt);tt=setTimeout(()=>$('toast').style.display='none',6000)}
$('undo').onclick=async()=>{for(const id of lastAdded)await delEntry(id);lastAdded=[];$('toast').style.display='none';$('result').innerHTML=''};
function table(sep){const T=totals();const lines=[['Артикул','Назва','Од. 1С','Кількість','Хто рахував'].join(sep)];for(const a of ARTS){const t=T.get(a.art);if(!t||!t.q&&!t.bad.length)continue;lines.push([a.art,a.name.replace(/[;\t]/g,' '),a.unit,String(Math.round(t.q*1000)/1000).replace('.',','),(me||'').replace(/[;\t]/g,' ')].join(sep))}return lines.join('\r\n')}
$('exp').onclick=async()=>{const csv='﻿'+table(';');const fn=`TSD_Mezhyhirska_${sid||today()}_${(me||'').replace(/[^0-9A-Za-zА-Яа-яІіЇїЄєҐґ]+/g,'_')}.csv`;const file=new File([csv],fn,{type:'text/csv'});
 try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:fn});return}}catch(e){if(e&&e.name==='AbortError')return}
 const u=URL.createObjectURL(file);const a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)};
$('copy').onclick=async()=>{const t=table('\t');try{await navigator.clipboard.writeText(t);toast('Скопійовано — вставте в Excel')}catch(e){$('dtext').value=t;$('dlg').showModal()}};
$('dclose').onclick=()=>$('dlg').close();
// ---------- boot ----------
render();
{let l=lsGet('inv:sessions',[]);if(!l.length){l=[today()];lsSet('inv:sessions',l)}local=true;fillSessions(l);
 me=lsGet('inv:who','');if(!me){$('who').innerHTML='<input id="whoI" placeholder="Ваше ім’я" aria-label="Ваше ім’я" style="max-width:170px">';$('whoI').onchange=e=>{me=e.target.value.trim();lsSet('inv:who',me)}}else $('who').textContent='Рахує: '+me}
})();
</script></body></html>

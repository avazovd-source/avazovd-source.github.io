window.addEventListener('error',function(e){var b=document.getElementById('banner');if(b){b.style.display='block';b.textContent='Помилка сторінки (v3): '+(e.message||'')+' · рядок '+(e.lineno||'?')+':'+(e.colno||'?')+'. Надішліть цей текст Claude.'}});
window.addEventListener('unhandledrejection',function(e){var b=document.getElementById('banner');if(b&&!b.textContent){b.style.display='block';b.textContent='Помилка (v3): '+String(e.reason&&(e.reason.message||e.reason.code)||e.reason)}});

<script>
(function(){'use strict';
const ARTS=window.__inv.arts();
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(Math.round(n*1000)/1000).toLocaleString('uk-UA',{maximumFractionDigits:3});
const norm=s=>String(s).toLowerCase().replace(/[’ʼ'`"«»]/g,'').replace(/ё/g,'е').replace(/(\d)\s*[,.]\s*(\d)/g,'$1.$2').replace(/[^0-9a-zа-яґєіїщ.\s]/gi,' ').replace(/\s+/g,' ').trim();
const STOP=new Set(['артикул','кількість','кількости','це','є','ще','у','в','на','і','та','з','по']);
ARTS.forEach(a=>{a.tok=norm(a.name).split(' ').filter(w=>w.length>1||/^\d/.test(w));a.key=a.art.toLowerCase()});
const NUM={'нуль':0,'один':1,'одна':1,'одне':1,'одну':1,'одного':1,'два':2,'дві':2,'две':2,'три':3,'чотири':4,'четыре':4,'пять':5,'шість':6,'шесть':6,'сім':7,'семь':7,'вісім':8,'восемь':8,'девять':9,'десять':10,'одинадцять':11,'одиннадцать':11,'дванадцять':12,'двенадцать':12,'тринадцять':13,'чотирнадцять':14,'пятнадцять':15,'шістнадцять':16,'сімнадцять':17,'вісімнадцять':18,'девятнадцять':19,'двадцять':20,'двадцать':20,'тридцять':30,'тридцать':30,'сорок':40,'пятдесят':50,'шістдесят':60,'сімдесят':70,'вісімдесят':80,'девяносто':90,'сто':100,'двісті':200,'двести':200,'триста':300,'чотириста':400,'пятсот':500,'тисяча':1000};
const UNIT=[[/^(кг|кіло|кило|кілограм[а-яіїєґ]*|килограмм[а-яіїєґ]*)$/,'кг'],[/^(г|гр|грам[а-яіїєґ]*|грамм[а-яіїєґ]*)$/,'г'],[/^(шт|штук[а-яіїєґ]*)$/,'шт'],[/^(л|літр[а-яіїєґ]*|литр[а-яіїєґ]*)$/,'л'],[/^(пак|пачк[а-яіїєґ]*|упаков[а-яіїєґ]*)$/,'пак'],[/^(пляш[а-яіїєґ]*|бутыл[а-яіїєґ]*)$/,'пляш']];
const unitOf=w=>{for(const[r,u]of UNIT)if(r.test(w))return u;return null};
const isNumTok=w=>/^\d+(\.\d+)?$/.test(w)||w in NUM||['півтора','півтори','полтора','пів','половиною','половина','кома','цілих','целых'].includes(w);
function parseQty(ws){let int=0,cur=0,dec=null,decDigits='',half=0,any=false;for(const w of ws){if(/^\d+(\.\d+)?$/.test(w)){if(dec!==null)decDigits+=w;else cur+=parseFloat(w);any=true}else if(w in NUM){if(dec!==null)decDigits+=String(NUM[w]);else cur+=NUM[w];any=true}else if(w==='півтора'||w==='півтори'||w==='полтора'){cur+=1.5;any=true}else if(w==='пів'||w==='половина'){cur+=.5;any=true}else if(w==='половиною')half=.5;else if(w==='кома'||w==='цілих'||w==='целых'){dec=cur;cur=0}}
 if(!any)return null;if(dec!==null)return dec+(decDigits?parseFloat('0.'+decDigits):0)+half;return int+cur+half}
function score(a,qt){let s=0;for(const q of qt){let b=0;if(q===a.key)return 3;for(const t of a.tok){if(t===q){b=1;break}if(q.length>=3&&t.startsWith(q))b=Math.max(b,.88);else if(t.length>=3&&q.startsWith(t))b=Math.max(b,.82);else{let k=0;while(k<q.length&&k<t.length&&q[k]===t[k])k++;if(k>=4)b=Math.max(b,.6+.05*Math.min(k-4,3))}}s+=b}return s/qt.length-.015*Math.max(0,a.tok.length-qt.length)}
function parsePhrase(text){const ws=norm(text).split(' ').filter(Boolean);let i=ws.length-1,unit=null;
 while(i>=0&&!unit&&!isNumTok(ws[i])){const u=unitOf(ws[i]);if(u){unit=u;i--;break}i--}
 let end=-1;for(let j=ws.length-1;j>=0;j--){if(isNumTok(ws[j])){end=j;break}}
 let start=end;
 if(end>=0){const dig=w=>/^\d+(\.\d+)?$/.test(w);
  if(dig(ws[end])){if(end>=2&&['кома','цілих','целых'].includes(ws[end-1])&&dig(ws[end-2]))start=end-2}
  else{while(start>0){const w=ws[start-1];if(dig(w))break;if(isNumTok(w)||w==='з')start--;else break}}}
 let qty=null;if(end>=0)qty=parseQty(ws.slice(start,end+1));
 if(!unit&&end>=0&&end+1<ws.length)unit=unitOf(ws[end+1]);
 const nameWs=ws.filter((w,k)=>!(end>=0&&k>=start&&k<=end)&&!unitOf(w)&&!STOP.has(w));
 return{qty,unit,nameWs,text}}
function findArt(nameWs){if(!nameWs.length)return[];const pool=window.__inv.pool(ARTS,$('kind').value);const sc=(pool.length?pool:ARTS).map(a=>({a,s:score(a,nameWs)})).filter(x=>x.s>.3).sort((x,y)=>y.s-x.s);return sc.slice(0,6)}
function convert(a,qty,said){if(!said||said===a.unit||(said==='пак'&&a.unit==='шт'))return{q:qty,bad:false};if(said==='г'&&a.unit==='кг')return{q:qty/1000,bad:false};if(said==='кг'&&a.unit==='г')return{q:qty*1000,bad:false};return{q:qty,bad:true}}
// ---------- storage ----------
let db=null,me='',sid=null,unsub=null,entries=[],local=false,zone='';
const ZONES=['Холодильник','Морозильна камера','Склад сухий','Цех'];
$('zones').innerHTML=['Без місця',...ZONES].map((z,i)=>`<button type="button" aria-pressed="${i===0}" data-z="${i?esc(z):''}">${esc(z)}</button>`).join('');
$('zones').onclick=e=>{const b=e.target.closest('button');if(!b)return;zone=b.dataset.z;for(const x of $('zones').children)x.setAttribute('aria-pressed',x===b)};
const today=()=>new Date().toISOString().slice(0,10);
function lsGet(k,d){k=window.__inv.key(k);try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}
function lsSet(k,v){k=window.__inv.key(k);try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
async function addEntry(e){if(db){try{const ref=await db.collection(`inv/${sid}/entries`).add(e);return ref.id}catch(err){banner('Не вдалося зберегти: '+(err.code||'помилка')+'. Спробуйте ще раз.');return null}}
 e.id='l'+Date.now()+Math.random().toString(36).slice(2,6);entries.push(e);lsSet('inv:'+sid,entries);render();return e.id}
async function delEntry(id){if(db){try{await db.doc(`inv/${sid}/entries/${id}`).delete()}catch(err){banner('Не вдалося видалити.')}return}entries=entries.filter(x=>x.id!==id);lsSet('inv:'+sid,entries);render()}
function banner(t){const b=$('banner');b.textContent=t;b.style.display=t?'block':'none'}
function openSession(s){sid=s;if(unsub){unsub();unsub=null}entries=[];render();
 if(db){const t=setTimeout(()=>banner('Дані поки недоступні — перевірте зв’язок.'),10000);
  unsub=db.collection(`inv/${sid}/entries`).orderBy('t').onSnapshot(sn=>{if(!sn.metadata.fromCache){clearTimeout(t);banner('')}entries=sn.docs.map(d=>({id:d.id,...d.data()}));render()},err=>{clearTimeout(t);banner('Зв’язок з базою втрачено ('+err.code+'). Нові записи не збережуться.')})}
 else{entries=lsGet('inv:'+sid,[]);render()}}
function fillSessions(list){const sel=$('sess');const cur=sid;sel.innerHTML=list.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');if(cur&&list.includes(cur))sel.value=cur;else if(list.length){sel.value=list[list.length-1];openSession(sel.value)}}
$('sess').onchange=e=>openSession(e.target.value);
$('newS').onclick=async()=>{let s=today();const have=[...$('sess').options].map(o=>o.value);let n=2;while(have.includes(s))s=today()+'-'+(n++);
 lsSet('inv:sessions',[...have,s]);fillSessions([...have,s]);sid=null;$('sess').value=s;openSession(s)};
// ---------- input ----------
let lastAdded=[];
async function commit(a,p,cands){const c=convert(a,p.qty,p.unit);const e={art:a.art,name:a.name,unit:a.unit,qty:c.q,said:p.unit||a.unit,saidQty:p.qty,bad:c.bad,zone,by:me,t:Date.now(),raw:p.text.slice(0,200)};
 const id=await addEntry(e);if(!id)return;lastAdded=[id];try{const h=$('hstat');h.style.background='#0f7b4b';h.style.padding='2px 8px';h.style.borderRadius='8px';setTimeout(()=>{h.style.background='';h.style.padding=''},1200)}catch(e){}toast(`${a.name}: +${fmt(c.q)} ${c.bad?p.unit:a.unit}${c.bad?' (інша одиниця!)':''}`);
 $('result').innerHTML=`<div class="res"><div class="big">${esc(a.name)}</div><div>${esc(a.art)} · <b>+${esc(fmt(c.q))} ${esc(c.bad?p.unit:a.unit)}</b>${c.bad?` <span class="warn">у 1С одиниця «${esc(a.unit)}» — перевірте</span>`:''}</div>${cands&&cands.length>1?`<p class="hint">Не той артикул? Натисніть правильний — запис заміниться.</p><div class="cands">${cands.slice(1,4).map((x,i)=>`<button type="button" data-swap="${i+1}">${esc(x.a.name)}<span class="tag">${esc(x.a.art)} · ${esc(x.a.unit)}</span></button>`).join('')}</div>`:''}</div>`;
 const box=$('result').querySelector('.cands');if(box)box.onclick=async ev=>{const b=ev.target.closest('button');if(!b)return;await delEntry(id);commit(cands[+b.dataset.swap].a,p,null)}}
function ask(p,cands,msg){$('result').innerHTML=`<div class="res"><div>${esc(msg)}</div><div class="hint">«${esc(p.text)}»</div><div class="cands">${cands.map((x,i)=>`<button type="button" data-i="${i}">${esc(x.a.name)}<span class="tag">${esc(x.a.art)} · ${esc(x.a.unit)}</span></button>`).join('')}</div></div>`;
 $('result').querySelector('.cands').onclick=async ev=>{const b=ev.target.closest('button');if(!b)return;const a=cands[+b.dataset.i].a;if(p.qty==null){processed='';$('say').value=a.name+' ';$('say').focus();$('result').innerHTML='';process();return}await commit(a,p,null);process()}}
const queue=[];let busy=false;window.__inv.api={parsePhrase,norm,ARTS,commit,esc,$};
function handle(text){for(const part of String(text).split(/\s*(?:;|\.(?!\d)|(?:^|\s)(?:далі|дальше|наступн[а-яіїєґ]*)(?=\s|$))\s*/i))if(part.trim())queue.push(part);process()}
async function process(){if(busy)return;busy=true;while(queue.length){const part=queue.shift();if(await window.__inv.pre(part,{parsePhrase,norm,ARTS,commit,esc,$}))continue;const p=parsePhrase(part);if(!p.nameWs.length){await window.__inv.bare(p,{commit});continue}const c=findArt(p.nameWs);
 if(!c.length){$('result').innerHTML=`<div class="res"><span class="warn">Не знайшов артикул:</span> «${esc(part)}». Скажіть інакше або знайдіть у списку «Усі артикули».</div>`;continue}
 if(p.qty==null){busy=false;ask(p,c,'Не почув кількість. Оберіть артикул і допишіть кількість:');return}
 const sure=c[0].s>=.75&&(c.length<2||c[0].s-c[1].s>=.12);if(sure){await commit(c[0].a,p,c)}else{busy=false;ask(p,c,`Кількість ${fmt(p.qty)} ${p.unit||''} — який артикул?`+(queue.length?` (далі в черзі: ${queue.length})`:''));return}}busy=false}
let kb=/iPhone|iPad|iPod/.test(navigator.userAgent),processed='',kt=null;
const KBHINT='Натисніть мікрофон на клавіатурі і говоріть: «назва, кількість, одиниця». Після паузи позиція додається сама — одразу кажіть наступну.';
function kbStart(){kb=true;processed='';const i=$('say');i.value='';i.focus();try{i.scrollIntoView({block:'center'})}catch(e){}$('hint').textContent=KBHINT;$('hint').style.cssText='color:var(--ink);font-weight:600'}
function kbFlush(){const v=$('say').value;const part=v.startsWith(processed)?v.slice(processed.length):v;if(!part.trim())return;if(!window.__inv.ready(part,{parsePhrase,norm,ARTS}))return;processed=v;handle(part)}
$('say').addEventListener('input',()=>{if(!kb)return;clearTimeout(kt);kt=setTimeout(kbFlush,1600)});
$('say').addEventListener('blur',()=>{if(kb&&processed&&$('say').value===processed){$('say').value='';processed=''}});
if(kb)$('hint').textContent='iPhone: натисніть поле або помаранчеву кнопку, потім мікрофон на клавіатурі. Позиції додаються самі після паузи.';
$('sayF').onsubmit=e=>{e.preventDefault();clearTimeout(kt);const v=$('say').value;const part=(kb&&processed&&v.startsWith(processed)?v.slice(processed.length):v).trim();if(part)handle(part);$('say').value='';processed=''};
// ---------- dictation ----------
let dict=null,listening=false;
$('mic').onclick=()=>{if(!dict){kbStart();return}
 if(listening){dict.stop().catch(()=>{});return}
 dict.start().catch(err=>{if(err&&err.code==='not_granted'){dict=null;$('hint').textContent='Доступ до мікрофона не надано — користуйтеся диктуванням клавіатури.'}})};
(()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;let rec=null,want=false;
 dict={start(){want=true;rec=new SR();rec.lang='uk-UA';rec.continuous=true;rec.interimResults=true;
  rec.onresult=ev=>{let part='';for(let i=ev.resultIndex;i<ev.results.length;i++){const r=ev.results[i];if(r.isFinal){$('partial').textContent='';handle(r[0].transcript)}else part+=r[0].transcript}if(part)$('partial').textContent=part};
  rec.onstart=()=>{listening=true;$('mic').classList.add('on')};rec.onend=()=>{if(want){try{rec.start();return}catch(e){}}listening=false;$('mic').classList.remove('on')};
  rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){want=false;dict=null;$('hint').textContent='Доступ до мікрофона не надано — користуйтеся диктуванням клавіатури.'}};
  rec.start();return Promise.resolve()},stop(){want=false;try{rec&&rec.stop()}catch(e){}return Promise.resolve()}}})();
// ---------- lists ----------
let tab='done';
document.querySelector('nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;for(const x of document.querySelectorAll('nav button'))x.setAttribute('aria-selected',x===b);render()};
$('q').oninput=render;$('kind').onchange=render;
function totals(){const m=new Map();for(const e of entries){const k=e.art;if(!m.has(k))m.set(k,{q:0,bad:[],list:[]});const t=m.get(k);if(e.bad)t.bad.push(e);else t.q+=e.qty;t.list.push(e)}return m}
function render(){try{window.__inv.recent(entries)}catch(e){}const T=totals();const q=norm($('q').value);const pool=window.__inv.pool(ARTS,$('kind').value);
 const match=a=>!q||a.key.includes(q)||norm(a.name).includes(q);
 $('cDone').textContent=T.size?`(${T.size})`:'';const left=pool.filter(a=>!T.has(a.art));$('cLeft').textContent=`(${left.length})`;
 let html='';
 if(tab==='done'){const rows=ARTS.filter(a=>T.has(a.art)&&match(a));
  html=rows.length?rows.map(a=>{const t=T.get(a.art);return`<li class="row" data-a="${esc(a.art)}"><div><div class="nm">${esc(a.name)}</div><div class="art">${esc(a.art)} · записів ${t.list.length}${t.bad.length?` · <span class="warn">${t.bad.length} з іншою одиницею</span>`:''}</div></div><div class="qty"${t.list.some(e=>e.edited)?' style="'+window.__inv.YEL+'padding:2px 6px"':''}>${esc(fmt(t.q))} ${esc(a.unit)}</div><div class="ent">${t.list.map(e=>`<div${e.edited?' style="'+window.__inv.YEL+'padding:4px 6px"':''}><span>${esc(fmt(e.bad?e.saidQty:e.qty))} ${esc(e.bad?e.said:a.unit)}${e.zone?' · '+esc(e.zone):''} · ${esc(new Date(e.t).toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'}))}${e.edited?' · змінено вручну':''}</span><span style="display:flex;gap:6px"><button class="del" type="button" data-ed="${esc(e.id)}">Змінити</button><button class="del" type="button" data-del="${esc(e.id)}">Видалити</button></span></div>`).join('')}</div></li>`}).join(''):`<li class="hint" style="padding:16px 0">Ще нічого не внесено. Натисніть мікрофон і скажіть, наприклад: «картопля очищена двадцять три кілограми».</li>`}
 else{const rows=(tab==='left'?left:pool).filter(match).slice(0,q?300:2000);
  html=rows.map(a=>{const t=T.get(a.art);return`<li class="row"><div><div class="nm">${esc(a.name)}</div><div class="art">${esc(a.art)}${t?` · внесено ${esc(fmt(t.q))} ${esc(a.unit)}`:''}</div></div><form class="qin" data-a="${esc(a.art)}"><input inputmode="decimal" aria-label="Кількість, ${esc(a.unit)}" placeholder="${esc(a.unit)}"><button type="submit" aria-label="Додати">+</button></form></li>`}).join('')}
 $('list').innerHTML=html;
 const all=ARTS.filter(a=>T.has(a.art)).length;$('hstat').textContent=`Внесено: ${entries.length} записів · ${all} артикулів`;$('stat').textContent=entries.length?`${entries.length} записів, ${all} артикулів${local?' · лише на цьому пристрої':''}`:''}
$('list').onclick=e=>{const ed=e.target.closest('[data-ed]');if(ed){window.__inv.edit(ed.dataset.ed,ed);return}const d=e.target.closest('[data-del]');if(d){delEntry(d.dataset.del);return}const r=e.target.closest('.row[data-a]');if(r&&!e.target.closest('form'))r.classList.toggle('open')};
$('list').onsubmit=e=>{e.preventDefault();const f=e.target.closest('form');if(window.__inv.multi(f,{ARTS,commit}))return;const v=parseFloat(f.querySelector('input').value.replace(',','.'));if(!(v>=0))return;const a=ARTS.find(x=>x.art===f.dataset.a);commit(a,{qty:v,unit:a.unit,text:'вручну'},null);f.querySelector('input').value=''};
// ---------- toast / export ----------
let tt=null;function toast(m){$('tmsg').textContent=m;$('toast').style.display='flex';clearTimeout(tt);tt=setTimeout(()=>$('toast').style.display='none',3000)}
$('undo').onclick=async()=>{for(const id of lastAdded)await delEntry(id);lastAdded=[];$('toast').style.display='none';$('result').innerHTML=''};
function table(sep){const T=totals();const lines=[['Артикул','Назва','Од. 1С','Кількість','Хто рахував','Скориговано вручну'].join(sep)];for(const a of ARTS){const t=T.get(a.art);if(!t||!t.q&&!t.bad.length)continue;lines.push([a.art,a.name.replace(/[;\t]/g,' '),a.unit,String(Math.round(t.q*1000)/1000).replace('.',','),(me||'').replace(/[;\t]/g,' '),t.list.some(e=>e.edited)?'так':''].join(sep))}return lines.join('\r\n')}
$('exp').onclick=async()=>{const csv='﻿'+table(';');const fn=`TSD_${window.__inv.whCode()}_${sid||today()}_${(me||'').replace(/[^0-9A-Za-zА-Яа-яІіЇїЄєҐґ]+/g,'_')}.csv`;const file=new File([csv],fn,{type:'text/csv'});
 try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:fn});return}}catch(e){if(e&&e.name==='AbortError')return}
 const u=URL.createObjectURL(file);const a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)};
$('copy').onclick=async()=>{const t=table('\t');try{await navigator.clipboard.writeText(t);toast('Скопійовано — вставте в Excel')}catch(e){$('dtext').value=t;$('dlg').showModal()}};
$('dclose').onclick=()=>$('dlg').close();
// ---------- boot ----------
render();
{let l=lsGet('inv:sessions',[]);if(!l.length){l=[today()];lsSet('inv:sessions',l)}local=true;fillSessions(l);
 me=lsGet('inv:who','');$('who').innerHTML='<input id="whoI" type="text" autocapitalize="off" autocorrect="off" placeholder="Ім’я або e-mail" aria-label="Ім’я або e-mail" style="max-width:220px">';$('whoI').value=me;$('whoI').onchange=e=>{me=e.target.value.trim();lsSet('inv:who',me);window.__inv.mail()};window.__inv.st={get entries(){return entries},get sid(){return sid},get me(){return me},save(){lsSet('inv:'+sid,entries);render()},redate(s){const l=lsGet('inv:sessions',[]);if(l.includes(s)){$('sess').value=s;openSession(s);return false}const old=sid,i=l.indexOf(old);lsSet('inv:'+s,entries);if(i>=0)l[i]=s;else l.push(s);lsSet('inv:sessions',l);try{localStorage.removeItem(window.__inv.key('inv:'+old))}catch(e){}sid=null;fillSessions(l);$('sess').value=s;openSession(s);return true},totals,ARTS,toast};window.__inv.mail()}
})();
